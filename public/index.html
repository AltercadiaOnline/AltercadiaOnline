<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Altercadia.online</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app-ui/ui-runtime.css?v=c4daab4" />
    <link rel="stylesheet" href="/styles.css?v=c4daab4" />
    <link rel="modulepreload" href="/app-ui/ui-runtime.js?v=marcos-click-1" />
    <script>
      (function () {
        var CANONICAL = 'https://altercadia-online.vercel.app';
        var search = window.location.search;
        var hash = window.location.hash || '';
        var host = window.location.hostname || '';
        var isPreview =
          host.indexOf('-projects.vercel.app') !== -1 ||
          (host.slice(-12) === '.vercel.app' && host !== 'altercadia-online.vercel.app');
        var isOAuthReturn =
          /(?:[?&]code=|[?&]error=)/.test(search);
        var isEmailReturn =
          /(?:[?&]token_hash=|[?&]type=(signup|recovery|email|magiclink|invite))/.test(search) ||
          /type=(signup|recovery|email|magiclink|invite)/.test(hash) ||
          (/access_token=/.test(hash) && !/(?:[?&]code=)/.test(search));
        var isAuthReturn = isOAuthReturn || isEmailReturn;
        if (!isAuthReturn) return;

        if (isPreview) {
          window.location.replace(CANONICAL + '/characters' + search + hash);
          return;
        }

        var path = window.location.pathname || '/';
        if (path === '/characters') return;
        if (path === '/' || path === '' || path === '/game') {
          window.location.replace(
            window.location.origin + '/characters' + search + hash,
          );
        }
      })();
    </script>
      <script>window.__ALTERCADIA_BUILD__="c4daab4";</script>
  </head>
  <body data-ui-architecture="online-react-v1">
    <div id="login-screen" class="screen hidden" aria-hidden="true" hidden></div>

    <div id="char-select-screen" class="screen hidden" aria-hidden="true" hidden></div>

    <div id="screen-react-root" class="screen-react-root hidden" aria-hidden="true"></div>
    <div id="screen-overlay-root" class="screen-overlay-root" aria-hidden="true"></div>

    <div id="game-container" class="screen hidden" aria-hidden="true">
      <!-- Coluna de render compartilhada — Construct (mundo); combate usa shell React. -->
      <div id="game-render-column" class="game-render-column" aria-label="Viewport do jogo">
        <div id="game-viewport" class="game-viewport-container game-layout__viewport">
          <div id="game-stage-frame" class="game-stage-frame">
            <!-- Core de layout: container 640×360 — escala CSS aplicada aqui (spec: #game-container) -->
            <div id="game-stage-scale" class="game-stage-scale">
              <main id="game-stage">
                <div id="game-render-host" class="game-render-host" data-render-engine="construct">
                  <div id="world-mount-root" class="world-mount-root hidden" aria-hidden="true" aria-label="Mundo Altercadia (Construct)"></div>
                </div>
              </main>
            </div>
            <div id="npc-names-layer" class="npc-names-layer" aria-hidden="true"></div>
            <div id="speech-bubbles-layer" class="speech-bubbles-layer" aria-hidden="true"></div>
            <div id="game-ui-overlay" class="game-ui-overlay" aria-label="HUD do mundo">
              <div id="ui-layer" class="ui-layer" aria-label="Camada de interface legado"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Fade compartilhado — exploração ↔ batalha; cobre #game-render-column -->
      <div id="game-scene-fade-overlay" class="game-scene-fade-overlay hidden" aria-hidden="true"></div>

      <div id="scene-exploration" class="scene hidden">
        <div id="vortex-app" class="app-wrapper game-layout">
          <div class="game-layout__viewport-spacer" aria-hidden="true"></div>
        </div>
      </div>

      <div id="scene-combat" class="scene hidden" aria-hidden="true">
        <div id="battle-fade-overlay" class="battle-fade-overlay hidden" aria-hidden="true"></div>
        <div
          class="battle-screen battle-screen--terminal battle-screen--side-view"
          data-battle-hud
          aria-hidden="true"
        >
          <section class="battle-combat-top" aria-label="Área de combate">
            <div id="battle-stage-frame" class="battle-stage-frame">
              <canvas
                id="battle-background-canvas"
                class="battle-stage-background"
                width="640"
                height="360"
                aria-hidden="true"
              ></canvas>
              <div id="battle-stage-scale" class="battle-stage-scale">
                <div class="battle-arena battle-arena--side-view battle-arena--canvas" aria-label="Cenário de combate">
                  <canvas
                    id="battle-arena-canvas"
                    class="battle-arena__canvas"
                    width="640"
                    height="360"
                    aria-label="Arena de batalha"
                  ></canvas>
                  <!-- Ancoras invisíveis alinhadas aos sprites do canvas (VFX de hit) -->
                  <div class="battle-arena__fighters battle-arena__fighters--hit-anchors" aria-hidden="true">
                    <div id="battle-player-portrait" class="battle-portrait battle-portrait--player" data-side="player"></div>
                    <div id="battle-opponent-portrait" class="battle-portrait battle-portrait--opponent" data-side="opponent"></div>
                  </div>
                  <div class="battle-arena__effects" data-battle-effects-layer aria-hidden="true"></div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>

      <div id="scene-transition" class="scene scene-transition loading-overlay hidden" aria-hidden="true" aria-label="Carregando">
        <div class="scene-transition__inner">
          <div class="scene-transition__spinner" aria-hidden="true"></div>
          <p class="scene-transition__label">Carregando…</p>
        </div>
      </div>

      <div id="game-react-hud-root" class="game-react-hud-root" aria-hidden="true"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2/+esm",
          "gsap": "/vendor/gsap/index.js",
          "zustand": "https://cdn.jsdelivr.net/npm/zustand@5.0.14/+esm",
          "zustand/": "https://cdn.jsdelivr.net/npm/zustand@5.0.14/"
        }
      }
    </script>
    <script>(function(){var b=window.__ALTERCADIA_BUILD__;if(!b)return;fetch("/config/deploy-manifest.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(m){var e=(m.commitShort||m.commit||"").slice(0,12);if(!e||e===b)return;var k="altercadia.boot-reload."+e;if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,"1");var u=new URL(location.href);u.searchParams.set("build",e);location.replace(u.href);}).catch(function(){});})();</script>

    <script type="module" src="/app-ui/ui-runtime.js?v=c4daab4"></script>
    <script type="module" src="/client/browser/main.js?v=c4daab4"></script>
  </body>
</html>
